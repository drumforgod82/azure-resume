name: deploy_frontend
# Deploys when push is made from frontend folder

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  STORAGE_ACCOUNT: azureresumestoragejames
  CDN_PROFILE: azureresumejamesdean
  CDN_ENDPOINT: azureresumejamesdean
  CDN_DOMAINS: "azureresumejamesdean-hqhtdmdmejcge5hg.z01.azurefd.net azureresumejamesdean.azureedge.net www.jamesdean.me"
  RESOURCE_GROUP: azureresume-rg

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload to blob storage
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name ${{ env.STORAGE_ACCOUNT }} \
              -d '$web' \
              -s frontend/ \
              --overwrite

      - name: Purge Front Door cache
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az afd endpoint purge \
              --content-paths "/*" \
              --profile-name "${{ env.CDN_PROFILE }}" \
              --endpoint-name "${{ env.CDN_ENDPOINT }}" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --domains ${{ env.CDN_DOMAINS }}

      - name: Azure Logout
        run: az logout
        if: always()
